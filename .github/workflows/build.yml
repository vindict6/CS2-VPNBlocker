name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet publish CS2-VPNBlocker.csproj -c Release -o publish

      - name: Package
        run: |
          mkdir -p package/addons/counterstrikesharp/plugins/CS2-VPNBlocker
          cp publish/CS2-VPNBlocker.dll package/addons/counterstrikesharp/plugins/CS2-VPNBlocker/
          cd package && zip -r ../CS2-VPNBlocker.zip addons

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS2-VPNBlocker
          path: CS2-VPNBlocker.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CS2-VPNBlocker.zip
          generate_release_notes: true
